[versions]
# Same line as mail-mcp-server (C:\git\mail-mcp-server @ gradle/libs.versions.toml); move both to
# the final releases together.
spring-boot = "4.2.0-RC1"
spring-ai = "2.1.0-RC1"
lucene = "10.5.2"
# In-process embeddings (docs/decisions.md D11, D24): ONNX Runtime runs the model, DJL's Hugging Face
# tokenizer reads its tokenizer.json.
# 1.21 and later need msvcp140.dll 14.40+, older than what JDKs ship in bin/ on Windows (14.31 in
# Liberica 25.0.2): 1.32 crashes the JVM, 1.21 fails to load. Stay on 1.20 until JDKs catch up (D24).
onnxruntime = "1.20.0"
djl-tokenizers = "0.40.0"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version = "1.1.7" }

[libraries]
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-ai-mcp-server = { module = "org.springframework.ai:spring-ai-starter-mcp-server", version.ref = "spring-ai" }
# The streamable HTTP transport of MCP (docs/decisions.md D45); stdio stays the default.
spring-ai-mcp-server-webmvc = { module = "org.springframework.ai:spring-ai-starter-mcp-server-webmvc", version.ref = "spring-ai" }
# EmbeddingModel and Document (docs/decisions.md D28, D29); the starter brings it transitively too.
spring-ai-model = { module = "org.springframework.ai:spring-ai-model", version.ref = "spring-ai" }
# Filter expressions and their text parser (docs/decisions.md D30).
spring-ai-vector-store = { module = "org.springframework.ai:spring-ai-vector-store", version.ref = "spring-ai" }
# The pdf format wraps Spring AI's PDF reader (docs/decisions.md D32); brings PDFBox.
spring-ai-pdf-document-reader = { module = "org.springframework.ai:spring-ai-pdf-document-reader", version.ref = "spring-ai" }
# A remote embedding model of an OpenAI-compatible endpoint as a Spring AI bean (docs/decisions.md
# D43, D67): the model module and its auto-configuration, not the starter, which brings ChatClient,
# chat memory and WebClient. Only the embedding model is switched on, and only by the operator.
spring-ai-openai = { module = "org.springframework.ai:spring-ai-openai", version.ref = "spring-ai" }
spring-ai-autoconfigure-model-openai = { module = "org.springframework.ai:spring-ai-autoconfigure-model-openai", version.ref = "spring-ai" }
lucene-core = { module = "org.apache.lucene:lucene-core", version.ref = "lucene" }
lucene-analysis-common = { module = "org.apache.lucene:lucene-analysis-common", version.ref = "lucene" }
lucene-queryparser = { module = "org.apache.lucene:lucene-queryparser", version.ref = "lucene" }
lucene-highlighter = { module = "org.apache.lucene:lucene-highlighter", version.ref = "lucene" }
# MoreLikeThis for relatedRecords in a collection without vectors (docs/decisions.md D72).
lucene-queries = { module = "org.apache.lucene:lucene-queries", version.ref = "lucene" }
onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime" }
djl-tokenizers = { module = "ai.djl.huggingface:tokenizers", version.ref = "djl-tokenizers" }
